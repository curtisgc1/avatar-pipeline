services:
  # Viseme Bus (Redis)
  viseme-bus:
    image: redis:alpine
    container_name: avatar-viseme-bus
    ports:
      - "6379:6379"
    restart: unless-stopped

  # STT Service (CPU only - using faster-whisper)
  whisper-stt:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: avatar-stt
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=base
      - ASR_ENGINE=faster_whisper
    volumes:
      - ~/avatar-models/whisper:/root/.cache/whisper
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    restart: unless-stopped

  # TTS Service - Kokoro (Jetson compatible)
  kokoro-tts:
    build:
      context: ./kokoro
      dockerfile: Dockerfile
    container_name: avatar-tts
    ports:
      - "5002:5002"
    volumes:
      - ~/avatar-models/tts:/models
    restart: unless-stopped
